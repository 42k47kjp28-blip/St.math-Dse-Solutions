<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel DSE 數學資源 | 詳細解答</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
    
    body { font-family: 'Noto Sans TC', 'Inter', system-ui, sans-serif; }
    
    .solution-card {
      transition: all 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .solution-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-white">

  <!-- Nav -->
  <nav class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-x-3">
        <div class="w-9 h-9 bg-amber-300 rounded-xl flex items-center justify-center">
          <span class="text-zinc-950 font-bold text-xl">S</span>
        </div>
        <div>
          <div class="font-bold text-xl tracking-tight text-slate-900">Samuel DSE Math</div>
          <div class="text-[10px] text-slate-500 -mt-1">香港 DSE 數學資源</div>
        </div>
      </div>
      
      <div class="flex items-center gap-x-8 text-sm">
        <a href="index.html" class="font-medium text-slate-700 hover:text-amber-600">首頁</a>
        <a href="#" class="font-medium text-slate-700 hover:text-amber-600">M1 解答</a>
        <a href="#" class="font-medium text-slate-700 hover:text-amber-600">M2 解答</a>
        <a href="#" class="font-medium text-slate-700 hover:text-amber-600">關於我</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="max-w-6xl mx-auto px-6 pt-16 pb-12">
    <div class="max-w-2xl">
      <div class="inline-flex items-center gap-x-2 bg-amber-100 text-amber-700 px-4 py-1 rounded-full text-sm font-medium mb-6">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>為 DSE 學生及老師而設</span>
      </div>
      
      <h1 class="text-5xl font-bold tracking-tighter text-slate-900 leading-none">高質素 DSE 數學<br>詳細解答</h1>
      <p class="mt-6 text-xl text-slate-600">我自己整嘅 step-by-step 解答，幫你真正理解每一步點諗、點做。</p>
      
      <div class="flex items-center gap-x-4 mt-8">
        <a href="#solutions" 
           class="inline-flex items-center justify-center bg-amber-300 hover:bg-amber-400 transition-colors text-zinc-950 font-semibold px-8 h-12 rounded-2xl text-base">
          瀏覽所有解答
        </a>
        <a href="#" class="inline-flex items-center justify-center border border-slate-300 hover:bg-slate-50 transition-colors font-medium px-6 h-12 rounded-2xl text-base">
          關於 Samuel
        </a>
      </div>
    </div>
  </div>

  <!-- Solutions Section -->
  <div id="solutions" class="max-w-6xl mx-auto px-6 pb-20">
    <div class="flex items-end justify-between mb-8">
      <div>
        <h2 class="text-3xl font-bold tracking-tight text-slate-900">所有解答</h2>
        <p class="text-slate-600 mt-1">持續更新中 • 歡迎分享</p>
      </div>
      
      <div class="hidden md:block">
        <input type="text" id="searchInput" placeholder="搜尋題目或關鍵字..." 
               class="w-72 border border-slate-300 focus:border-amber-400 transition-colors px-4 h-10 rounded-2xl text-sm outline-none">
      </div>
    </div>

    <!-- 黑色卡片 + 淺金色字體 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="solutionsGrid">
      
      <!-- 範例卡片 1 -->
      <a href="solution-template.html" class="solution-card group block bg-zinc-950 hover:bg-black border border-zinc-800 rounded-3xl p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-x-2">
            <span class="px-3 py-0.5 text-xs font-semibold bg-amber-300 text-zinc-950 rounded-full">M1</span>
            <span class="text-sm text-amber-200">2026</span>
          </div>
          <span class="text-xs px-3 py-1 bg-zinc-800 text-amber-200 rounded-full">Q1</span>
        </div>
        
        <h3 class="font-semibold text-lg leading-snug text-amber-200 group-hover:text-amber-300 transition-colors">
          微分應用與曲線性質
        </h3>
        <p class="text-sm text-amber-100/70 mt-2 line-clamp-2">
          求函數的駐點、拐點，並判斷曲線的凹凸性。
        </p>
        
        <div class="mt-5 flex items-center gap-x-2">
          <span class="text-xs px-3 py-1 bg-zinc-800 text-amber-200 rounded-full">微積分</span>
        </div>
      </a>

      <!-- 你之後可以複製上面呢個卡片，加更多題目 -->

    </div>
    
    <p class="text-center text-sm text-slate-500 mt-10">想加更多題目？直接複製上面嘅卡片結構，改內容同連結就得。</p>
  </div>

  <footer class="border-t bg-white py-8">
    <div class="max-w-6xl mx-auto px-6 text-center text-sm text-slate-500">
      © Samuel DSE Math • 專為香港 DSE 學生而設
    </div>
  </footer>

  <script>
    // 搜尋功能
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        const term = this.value.toLowerCase();
        document.querySelectorAll('#solutionsGrid > a').forEach(card => {
          const text = card.textContent.toLowerCase();
          card.style.display = text.includes(term) ? '' : 'none';
        });
      });
    }
  </script>
</body>
</html>
