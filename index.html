  <!-- Nav 保持原本或微調 -->

  <!-- Hero 區保持白底 -->

  <div class="max-w-6xl mx-auto px-6 pb-20">

            <span class="text-sm text-amber-200">2026</span>

    </div>
  </div>
  </nav>

  <!-- Hero -->
  <div class="max-w-6xl mx-auto px-6 pt-16 pb-12">
    <div class="max-w-2xl">
      <div class="inline-flex items-center gap-x-2 bg-indigo-100 text-indigo-700 px-4 py-1 rounded-full text-sm font-medium mb-6">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>為 DSE 學生及老師而設</span>
      </div>
      
      <h1 class="text-5xl font-bold tracking-tighter text-slate-900 leading-none">高質素 DSE 數學<br>詳細解答</h1>

          關於 Samuel
        </a>
      </div>
    </div>
  </div>

  <!-- Solutions Section -->
  <div id="solutions" class="max-w-6xl mx-auto px-6 pb-20">

      <!-- 之後可以加搜尋 -->
      <div class="hidden md:block">
        <input type="text" id="searchInput" placeholder="搜尋題目或關鍵字..."

      <!-- Example Card 1 -->
      <a href="solution-template.html" class="solution-card group block bg-white border border-slate-200 rounded-3xl p-6 hover:border-indigo-200">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-x-2">

  </div>

  <footer class="border-t bg-white py-8">
    <div class="max-w-6xl mx-auto px-6 text-center text-sm text-slate-500">

  <script>
    // 簡單搜尋功能（之後可以加強）
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        const term = this.value.toLowerCase();
        document.querySelectorAll('#solutionsGrid > a').forEach(card => {
          const text = card.textContent.toLowerCase();
          card.style.display = text.includes(term) ? '' : 'none';
        });
      });
    }
  </script>
